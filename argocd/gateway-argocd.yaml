apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-argocd
  namespace: argocd
  labels:
    name: gateway
    tier: backend
spec:
  project: default

  source:
    repoURL: git@github.com:MyProgrammingProjects/raspi-k3s-helm-charts.git
    targetRevision: main
    path: gateway-service/helm

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true

